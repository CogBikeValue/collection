<!DOCTYPE html>
<html lang="en">
	<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bike Value List</title>
	<meta name="description" content="Search for the looks of a bike.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://cogbikevalue.github.io/collection/">
	<meta property="og:title" content="OFFICIAL Cog Bike Collection">
	<meta property="og:description" content="Search for the looks of a bike.">
	<meta property="og:image" content="https://cogbikevalue.github.io/bikes/images/background.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="OFFICIAL Cog Bike Collection">
	<meta name="twitter:description" content="Search for the looks of a bike.">
	<meta name="twitter:image" content="https://cogbikevalue.github.io/bikes/images/background.png">
	<link rel="stylesheet" href="style.css">
	<link rel="icon" type="image/png" href="https://cogbikevalue.github.io/bikes/images/favicon.png">
        
    <head>
    <title>COG Bike Collection</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<div class="container">

    <div class="hero">
        <h1>Bike Collection</h1>
        <p class="subtitle">Browse all available bikes</p>

        <div class="search-container">
            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search bikes..."
            >
        </div>
    </div>

    <div id="bikeGrid" class="bike-grid">
        <div class="loading">Loading bikes...</div>
    </div>

</div>

<script>
const owner = "CogBikeValue";
const repo = "collection";
const folder = "images";

const api =
    `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`;

window.allBikeFiles = [];

async function loadBikes() {
    try {
        const response = await fetch(api);

        if (!response.ok) {
            throw new Error("Failed to fetch GitHub files");
        }

        const files = await response.json();

        const imageFiles = files.filter(file =>
            /\.(png|jpg|jpeg|webp|gif)$/i.test(file.name)
        );

        imageFiles.sort((a, b) =>
            a.name.localeCompare(b.name)
        );

        window.allBikeFiles = imageFiles;

        renderBikes(imageFiles);

    } catch (err) {

        document.getElementById("bikeGrid").innerHTML = `
            <div class="loading">
                Failed to load bikes.
            </div>
        `;

        console.error(err);
    }
}

function renderBikes(files) {

    const grid = document.getElementById("bikeGrid");

    grid.innerHTML = "";

    files.forEach(file => {

        const displayName = file.name
            .replace(/\.[^/.]+$/, "")
            .replace(/[-_]/g, " ");

        const card = document.createElement("div");
        card.className = "bike-card";

        card.innerHTML = `
            <img src="${file.download_url}" alt="${displayName}">
            <div class="bike-name">${displayName}</div>
        `;

        grid.appendChild(card);
    });

    if (files.length === 0) {
        grid.innerHTML = `
            <div class="loading">
                No bikes found.
            </div>
        `;
    }
}

document.addEventListener("DOMContentLoaded", () => {

    const searchInput = document.getElementById("searchInput");

    searchInput.addEventListener("input", () => {

        const search = searchInput.value
            .trim()
            .toLowerCase();

        const filtered = window.allBikeFiles.filter(file => {

            const bikeName = file.name
                .replace(/\.[^/.]+$/, "")
                .toLowerCase();

            return bikeName.includes(search);
        });

        renderBikes(filtered);
    });

    loadBikes();
});
</script>

</body>
</html>
